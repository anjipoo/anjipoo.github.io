- id: cyber-threat
  title: Cyber Threat Intelligence System
  tagline: Graph-powered threat detection at network scale
  description: >
    Built an end-to-end threat intelligence pipeline using Graph Convolutional Networks
    to model relationships between network entities. The system identifies malicious
    patterns across IP clusters, domains, and behavioral signatures with high precision
    on real-world security datasets.
  tags: [GCN, PyTorch, Network Security, Graph Learning]
  category: Graph Learning
  status: Research
  github: "https://github.com/anjipoo/Cyber-Threat-Intelligence-Platform-CTI-"

- id: fake-image
  title: Fake Image Detection
  tagline: Pixel-level forensics for synthetic media
  description: >
    Developed a computer vision pipeline to detect AI-generated and manipulated
    images using pixel-level statistical features, noise analysis, and frequency
    domain artifacts — achieving robust detection across multiple generation approaches.
  tags: [Computer Vision, Machine Learning, ImageIO, Java, Image Forensics]
  category: Computer Vision
  status: Research
  github: "https://github.com/anjipoo/mpj_enhancement"

- id: edu-assistant
  title: Edu Assistant AI
  tagline: RAG-powered academic knowledge engine
  description: >
    A retrieval-augmented generation system for educational content, combining
    FAISS vector search with LLM generation via a FastAPI backend. Supports
    multi-document ingestion, semantic chunking, and context-aware Q&A for
    student and instructor workflows.
  tags: [RAG, FAISS, FastAPI, LLM, Python]
  category: NLP
  status: Production
  github: "https://github.com/anjipoo/edu-assistant"
