- title: "Comparative Analysis of Deep Learning Models for Underwater Trash Detection"
  venue: "ICISA 2025"
  year: 2025
  description: >
    Compared R-CNN, YOLO, SSD, and DeepLabv3+ for underwater trash detection.
    DeepLabv3+ hit F1 = 0.92 — best at segmenting marine debris in the wild.
  tags: [Computer Vision, Deep Learning, Segmentation]
  link: "https://link.springer.com/chapter/10.1007/978-981-95-5923-7_2"

- title: "Enhancing Dermatological Diagnosis with Few-Shot Learning"
  venue: "ICCUBEA 2025"
  year: 2025
  description: >
    FSL for skin lesion classification with limited labels. DenseNet121
    achieved F1 = 0.97 at 10-shot — significant given how scarce labeled
    dermatology data actually is.
  tags: [Few-Shot Learning, Deep Learning, Medical AI]
  link: "https://ieeexplore.ieee.org/document/11284208"

- title: "A Hybrid Approach to Fake Job Detection Using NLP and ML"
  venue: "ICTBIG 2025"
  year: 2025
  description: >
    Hybrid NLP + ML pipeline for detecting fake job postings — sentiment
    analysis, keyword extraction, and deep learning. Built on real-world
    job listing data because the problem is genuinely annoying.
  tags: [NLP, BERT, Machine Learning]
  link: "https://ieeexplore.ieee.org/document/11323989"